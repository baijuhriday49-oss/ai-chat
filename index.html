<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Pro</title>
    <!-- CSS Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Icon Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-dark-900 text-gray-900 dark:text-gray-100 h-screen flex overflow-hidden">

    <!-- Mobile Header -->
    <div class="lg:hidden fixed top-0 left-0 right-0 h-16 bg-white dark:bg-dark-800 border-b dark:border-gray-700 flex items-center justify-between px-4 z-40">
        <button id="sidebar-toggle" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
            <i data-lucide="menu"></i>
        </button>
        <span class="font-bold text-lg">AI Assistant</span>
        <button id="theme-toggle" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
            <i data-lucide="sun" class="hidden dark:block"></i>
            <i data-lucide="moon" class="block dark:hidden"></i>
        </button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto z-50 w-72 bg-white dark:bg-dark-800 border-r dark:border-gray-700 flex flex-col transition-transform duration-300 ease-in-out">
        <div class="p-4 flex flex-col h-full">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i data-lucide="sparkles" class="text-white w-5 h-5"></i>
                    </div>
                    <h1 class="font-bold text-xl tracking-tight">AI Assistant</h1>
                </div>
                <button id="new-chat-btn" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors border dark:border-gray-600">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-1 pr-2" id="history-list">
                <!-- History items rendered here -->
            </div>

            <div class="mt-auto pt-4 border-t dark:border-gray-700 space-y-2">
                <button id="settings-btn" class="flex items-center space-x-3 w-full p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Settings</span>
                </button>
                <div class="hidden lg:block">
                    <button id="theme-toggle-desktop" class="flex items-center space-x-3 w-full p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" onclick="document.getElementById('theme-toggle').click()">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                        <span class="text-sm font-medium">Toggle Theme</span>
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative h-full w-full pt-16 lg:pt-0">
        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
            <!-- Messages rendered here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-8 pt-0">
            <div class="max-w-4xl mx-auto relative">
                <textarea 
                    id="chat-input" 
                    rows="1" 
                    placeholder="Type your message..." 
                    class="w-full bg-white dark:bg-dark-800 border dark:border-gray-700 rounded-2xl py-4 pl-4 pr-16 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-lg resize-none max-h-48"
                ></textarea>
                <button 
                    id="send-btn" 
                    class="absolute right-3 bottom-3 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-all disabled:opacity-50"
                >
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
            <p class="text-center text-xs text-gray-400 mt-4">
                Powered by GPT API. All data is stored locally in your browser.
            </p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-800 rounded-2xl w-full max-w-md shadow-2xl animate-fade-in overflow-hidden">
            <div class="p-6 border-b dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-xl font-bold">Settings</h2>
                <button id="close-settings" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="settings-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">API Key</label>
                    <input type="password" id="api-key" placeholder="sk-..." class="w-full p-3 rounded-lg border dark:border-gray-700 bg-gray-50 dark:bg-dark-900 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model</label>
                    <select id="model-select" class="w-full p-3 rounded-lg border dark:border-gray-700 bg-gray-50 dark:bg-dark-900 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        <option value="gpt-4o-mini">GPT-4o Mini</option>
                        <option value="gpt-4">GPT-4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">API Endpoint</label>
                    <input type="text" id="api-endpoint" placeholder="https://api.openai.com/v1/chat/completions" class="w-full p-3 rounded-lg border dark:border-gray-700 bg-gray-50 dark:bg-dark-900 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="pt-4">
                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
                        Save Configuration
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- App Entry -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
